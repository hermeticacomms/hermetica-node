# Push a tag matching package.json ("v0.1.0") to publish. npm trusted publishing (OIDC) needs no token once configured on
# npmjs.com; NPM_TOKEN is only for the very first publish, before the package exists there.
name: release
on:
  push: { tags: ['v*'] }
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run size --if-present
      - id: pack
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: '${{ steps.pack.outputs.file }}' }
      - run: npm publish "${{ steps.pack.outputs.file }}" --provenance --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
      - run: gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" dist/*.js --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
